<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#171311">
  <title>Ketuk Ryoshu — Limbus Plushie</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: "Segoe UI", "Trebuchet MS", sans-serif;
      background: #171311;
      color: #f6eee3;
      font-synthesis: none;
      text-rendering: optimizeLegibility;
      -webkit-font-smoothing: antialiased;
      --red: #bd4138;
      --muted: #b9aaa0;
    }

    * { box-sizing: border-box; }

    body {
      min-height: 100svh;
      margin: 0;
      overflow-x: hidden;
      background:
        radial-gradient(ellipse at 50% 42%, #38241f 0, #211916 36%, transparent 72%),
        repeating-linear-gradient(135deg, #ffffff03 0 1px, transparent 1px 7px),
        #171311;
    }

    body::before, body::after {
      position: fixed;
      z-index: -1;
      width: 24rem;
      height: 24rem;
      border: 1px solid #bd41381b;
      border-radius: 50%;
      content: "";
      pointer-events: none;
    }
    body::before { top: -15rem; left: -8rem; }
    body::after { right: -12rem; bottom: -17rem; width: 34rem; height: 34rem; }

    main {
      display: grid;
      grid-template-columns: minmax(0, 1fr);
      min-height: 100svh;
      justify-items: center;
      align-content: start;
      padding: 32px max(16px, env(safe-area-inset-left)) 32px max(16px, env(safe-area-inset-right));
    }

    .game {
      width: min(100%, 510px);
      min-width: 0;
      margin-inline: auto;
      text-align: center;
    }

    .eyebrow {
      display: inline-flex;
      align-items: center;
      gap: 9px;
      margin: 0 0 14px;
      color: #d18d79;
      font-size: .7rem;
      font-weight: 800;
      letter-spacing: .22em;
      text-transform: uppercase;
    }
    .eyebrow::before, .eyebrow::after {
      width: 24px;
      height: 1px;
      background: #ff1100;
      content: "";
    }

    h1 {
      margin: 0;
      font-family: Georgia, "Times New Roman", serif;
      font-size: clamp(2.4rem, 9vw, 4rem);
      font-weight: 700;
      letter-spacing: -.055em;
      line-height: 1;
    }
    h1 span { color: #ff1500; }

    .intro {
      margin: 14px 0 24px;
      color: var(--muted);
      font-size: .95rem;
    }

    .plushie-wrap {
      position: relative;
      width: min(100%, 348px);
      margin: 0 auto;
      padding: 10px;
      border: 1px solid #d6a27c55;
      border-radius: 50%;
      background: linear-gradient(145deg, #f0d8bb22, #bd413811 65%, transparent);
      box-shadow: 0 0 70px #c14b3d1a, 0 24px 60px #0008;
    }
    .plushie-wrap::before {
      position: absolute;
      inset: 10px;
      border: 1px solid #fff2;
      border-radius: 50%;
      content: "";
      pointer-events: none;
    }

    .plushie-button {
      display: block;
      width: 100%;
      padding: 0;
      overflow: hidden;
      border: 0;
      border-radius: 50%;
      appearance: none;
      background: transparent;
      color: inherit;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
    }
    .plushie-button:focus { outline: none; }
    .plushie-button:focus-visible {
      outline: 3px solid #ff0000;
      outline-offset: 5px;
    }

    .plushie {
      display: block;
      width: 100%;
      aspect-ratio: 1;
      object-fit: cover;
      user-select: none;
      -webkit-user-drag: none;
      pointer-events: none;
      transition: transform .16s ease, filter .16s ease;
    }
    .plushie-button:hover .plushie { filter: saturate(1.08) brightness(1.04); transform: scale(1.025); }
    .plushie-button:active .plushie { transform: scale(.94) rotate(-3deg); }
    .plushie-wrap.is-bopping { animation: impact .42s ease-out; }
    .plushie-wrap.is-bopping .plushie { animation: bop .42s cubic-bezier(.2, .8, .25, 1); }

    @keyframes bop {
      28% { transform: scale(.84) rotate(-7deg); }
      58% { transform: scale(1.08) rotate(4deg); }
      100% { transform: scale(1) rotate(0); }
    }
    @keyframes impact {
      30% { box-shadow: 0 0 95px #ff5a3d77, 0 24px 60px #0008; }
      100% { box-shadow: 0 0 70px #c14b3d1a, 0 24px 60px #0008; }
    }

    .spark {
      position: absolute;
      z-index: 1;
      color: #f3c79f;
      font-size: var(--size, 1.2rem);
      pointer-events: none;
      animation: sparkle .8s ease-out forwards;
    }
    @keyframes sparkle {
      from { opacity: 1; transform: translate(-50%, -50%) scale(.5) rotate(0); }
      to { opacity: 0; transform: translate(var(--x), var(--y)) scale(1.5) rotate(75deg); }
    }

    .scoreboard {
      display: flex;
      justify-content: center;
      gap: 12px;
      margin: 22px auto 0;
    }
    .score-card {
      min-width: 132px;
      padding: 11px 18px 12px;
      border: 1px solid #ffffff12;
      border-radius: 10px;
      background: #ffffff08;
    }
    .score-label {
      display: block;
      margin-bottom: 3px;
      color: #b9aaa0;
      font-size: .65rem;
      font-weight: 700;
      letter-spacing: .13em;
      text-transform: uppercase;
    }
    .score {
      color: #f7e5d2;
      font-family: Georgia, "Times New Roman", serif;
      font-size: 1.8rem;
      font-variant-numeric: tabular-nums;
    }

    .leaderboard {
      margin: 24px auto 0;
      padding: 18px;
      border: 1px solid #ffffff12;
      border-radius: 12px;
      background: #ffffff08;
      text-align: left;
    }
    .leaderboard h2 {
      margin: 0 0 14px;
      color: #f7e5d2;
      font-family: Georgia, "Times New Roman", serif;
      font-size: 1.25rem;
      text-align: center;
    }
    .save-score {
      display: flex;
      gap: 8px;
    }
    .save-score input {
      min-width: 0;
      flex: 1;
      padding: 10px 12px;
      border: 1px solid #ffffff24;
      border-radius: 7px;
      background: #171311;
      color: #f6eee3;
      font: inherit;
    }
    .save-score input:focus-visible, .save-score button:focus-visible {
      outline: 2px solid #ff1500;
      outline-offset: 2px;
    }
    .save-score button {
      padding: 10px 14px;
      border: 0;
      border-radius: 7px;
      background: #a82f27;
      color: #fff5eb;
      font: inherit;
      font-size: .85rem;
      font-weight: 700;
      cursor: pointer;
    }
    .save-score button:hover { background: #c43b30; }
    .leaderboard-status {
      min-height: 1.3em;
      margin: 9px 0;
      color: #d7ad94;
      font-size: .78rem;
      text-align: center;
    }
    .leaderboard-list {
      display: grid;
      gap: 6px;
      margin: 0;
      padding: 0;
      list-style: none;
    }
    .leaderboard-list li {
      display: grid;
      grid-template-columns: 30px 1fr auto;
      gap: 8px;
      align-items: center;
      padding: 8px 10px;
      border-radius: 6px;
      background: #ffffff08;
      font-size: .86rem;
    }
    .leaderboard-rank { color: #d18d79; font-weight: 700; }
    .leaderboard-name { overflow-wrap: anywhere; }
    .leaderboard-score { color: #f2c9aa; font-weight: 700; font-variant-numeric: tabular-nums; }
    .leaderboard-empty {
      grid-column: 1 / -1;
      margin: 0;
      color: var(--muted);
      font-size: .82rem;
      text-align: center;
    }

    .hint {
      min-height: 1.4em;
      margin: 15px 0 0;
      color: #ff0000;
      font-size: .83rem;
      transition: color .2s;
    }
    .hint.pop { color: #ffe5da; }
    .footer {
      margin: 31px 0 0;
      color: #8f7f75;
      font-size: .68rem;
      letter-spacing: .08em;
      text-transform: uppercase;
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation-duration: .01ms !important; transition-duration: .01ms !important; }
    }
  </style>
</head>
<body>
  <main>
    <section class="game" aria-labelledby="title">
      <h1 id="title">Klik <span>Ryoshu</span></h1>
      <p class="intro">My istri gwe</p>

      <div class="plushie-wrap" id="plushie-wrap">
        <button class="plushie-button" id="plushie-button" type="button" aria-label="Ketuk plushie Ryoshu untuk mendapat suara dan poin">
        <img
          class="plushie"
          id="plushie"
          src="images/limbus-company-plushie-ryoshu-17cm-f03cf8a2.jpg"
          alt="Plushie Ryoshu dari Limbus Company"
          draggable="false">
        </button>
      </div>

      <div class="scoreboard" aria-label="Skor permainan">
        <div class="score-card">
          <span class="score-label">Klik</span>
          <span class="score" id="score" aria-live="polite">0</span>
        </div>
        <div class="score-card">
          <span class="score-label">Rekor</span>
          <span class="score" id="best">0</span>
        </div>
      </div>
      <p class="hint" id="hint" aria-live="polite">Klik atau tekan Enter pada Ryoshu untuk mulai.</p>
      <audio id="voice" preload="auto"></audio>
      <section class="leaderboard" aria-labelledby="leaderboard-title">
        <h2 id="leaderboard-title">Leaderboard lokal</h2>
        <form class="save-score" id="save-score-form">
          <label for="player-name" hidden>Nama pemain</label>
          <input id="player-name" name="player-name" type="text" maxlength="20" placeholder="Nama pemain" autocomplete="nickname" required>
          <button type="submit">Simpan skor</button>
        </form>
        <p class="leaderboard-status" id="leaderboard-status" aria-live="polite">Simpan skor sesi ini untuk masuk peringkat.</p>
        <ol class="leaderboard-list" id="leaderboard-list" aria-label="10 skor tertinggi"></ol>
      </section>
    </section>
  </main>

  <script>
    const plushie = document.querySelector("#plushie");
    const plushieWrap = document.querySelector("#plushie-wrap");
    const voice = document.querySelector("#voice");
    const scoreDisplay = document.querySelector("#score");
    const bestDisplay = document.querySelector("#best");
    const hint = document.querySelector("#hint");
    const saveScoreForm = document.querySelector("#save-score-form");
    const playerNameInput = document.querySelector("#player-name");
    const leaderboardList = document.querySelector("#leaderboard-list");
    const leaderboardStatus = document.querySelector("#leaderboard-status");
    const leaderboardKey = "ryoshu-plushie-leaderboard";
    const voiceTracks = [
      "LCB_Sinner_Ryōshū_Chat_1.wav",
      "LCB_Sinner_Ryōshū_Clear.wav",
      "LCB_Sinner_Ryōshū_Get.wav",
      "LCB_Sinner_Ryōshū_Noon.wav"
    ];
    let previousVoiceTrack = "";
    let leaderboard = [];
    const messages = [
      "The audience here is dull. A real work of art should open their eyes.",
      "Didn’t even break a sweat. It’ll take more than this to excite me.",
      "Don’t bother me if you aren’t trying to tell me what time it is.",
      "Yep, nothing like a cig after lunch to drive off the dullness.",
      "If you wanna hang out with me, the least you can do is carry a lighter around, clock."
    ];
    let score = 0;
    let hintTimer;

    try {
      bestDisplay.textContent = localStorage.getItem("ryoshu-plushie-best") || "0";
    } catch (error) {
      console.warn("Rekor lokal tidak dapat dibaca.", error);
    }

    function loadLeaderboard() {
      try {
        const saved = JSON.parse(localStorage.getItem(leaderboardKey) || "[]");
        if (!Array.isArray(saved)) throw new TypeError("Data leaderboard bukan daftar.");
        leaderboard = saved.filter(entry =>
          entry &&
          typeof entry.name === "string" &&
          Number.isSafeInteger(entry.score) &&
          entry.score > 0 &&
          typeof entry.date === "string"
        ).slice(0, 10);
      } catch (error) {
        console.error("Leaderboard lokal tidak dapat dibaca.", error);
        leaderboardStatus.textContent = "Leaderboard tidak dapat dibaca dari penyimpanan browser.";
      }
      renderLeaderboard();
    }

    function renderLeaderboard() {
      leaderboardList.replaceChildren();
      if (leaderboard.length === 0) {
        const empty = document.createElement("li");
        empty.className = "leaderboard-empty";
        empty.textContent = "Belum ada skor. Jadilah yang pertama!";
        leaderboardList.append(empty);
        return;
      }

      leaderboard.forEach((entry, index) => {
        const row = document.createElement("li");
        const rank = document.createElement("span");
        const name = document.createElement("span");
        const points = document.createElement("span");
        rank.className = "leaderboard-rank";
        name.className = "leaderboard-name";
        points.className = "leaderboard-score";
        rank.textContent = `${index + 1}.`;
        name.textContent = entry.name;
        points.textContent = `${entry.score} klik`;
        row.append(rank, name, points);
        leaderboardList.append(row);
      });
    }

    saveScoreForm.addEventListener("submit", event => {
      event.preventDefault();
      const name = playerNameInput.value.trim();
      if (!name) {
        leaderboardStatus.textContent = "Masukkan nama pemain terlebih dahulu.";
        playerNameInput.focus();
        return;
      }
      if (score < 1) {
        leaderboardStatus.textContent = "Klik Ryoshu dulu sebelum menyimpan skor.";
        return;
      }

      const entry = { name, score, date: new Date().toISOString() };
      const updated = [...leaderboard, entry]
        .sort((a, b) => b.score - a.score || a.date.localeCompare(b.date))
        .slice(0, 10);
      try {
        localStorage.setItem(leaderboardKey, JSON.stringify(updated));
      } catch (error) {
        console.error("Skor tidak dapat disimpan ke leaderboard lokal.", error);
        leaderboardStatus.textContent = "Skor tidak dapat disimpan. Periksa pengaturan penyimpanan browser.";
        return;
      }

      leaderboard = updated;
      renderLeaderboard();
      const rank = leaderboard.indexOf(entry);
      leaderboardStatus.textContent = rank === -1
        ? "Skor tersimpan, tetapi belum masuk 10 besar."
        : `Skor tersimpan di peringkat ${rank + 1}!`;
    });

    loadLeaderboard();

    function makeSparkles() {
      const symbols = ["✦", "✧", "✦", "·", "✧", "✦", "·"];
      for (let i = 0; i < symbols.length; i += 1) {
        const spark = document.createElement("span");
        spark.className = "spark";
        spark.textContent = symbols[i];
        spark.style.left = `${35 + Math.random() * 30}%`;
        spark.style.top = `${35 + Math.random() * 30}%`;
        spark.style.setProperty("--size", `${1 + Math.random() * 1.2}rem`);
        spark.style.setProperty("--x", `${(Math.random() - .5) * 210}px`);
        spark.style.setProperty("--y", `${(Math.random() - .75) * 190}px`);
        plushieWrap.append(spark);
        spark.addEventListener("animationend", () => spark.remove(), { once: true });
      }
    }

    function playRandomVoice() {
      const availableTracks = voiceTracks.filter(track => track !== previousVoiceTrack);
      const track = availableTracks[Math.floor(Math.random() * availableTracks.length)];
      previousVoiceTrack = track;
      const source = `voice/${encodeURIComponent(track)}`;

      if (!voice.src.endsWith(source)) {
        voice.src = source;
        voice.load();
      } else {
        voice.currentTime = 0;
      }

      voice.play().catch(error => console.warn("Suara Ryōshū tidak dapat diputar.", error));
    }

    function tapRyoshu() {
      score += 1;
      scoreDisplay.textContent = String(score);
      hint.textContent = messages[(score - 1) % messages.length];
      hint.classList.add("pop");
      clearTimeout(hintTimer);
      hintTimer = setTimeout(() => hint.classList.remove("pop"), 450);

      const best = Number(bestDisplay.textContent) || 0;
      if (score > best) {
        bestDisplay.textContent = String(score);
        try {
          localStorage.setItem("ryoshu-plushie-best", String(score));
        } catch (error) {
          console.warn("Rekor lokal tidak dapat disimpan.", error);
        }
      }

      playRandomVoice();
      plushieWrap.classList.remove("is-bopping");
      void plushieWrap.offsetWidth;
      plushieWrap.classList.add("is-bopping");
      makeSparkles();
    }

    document.querySelector("#plushie-button").addEventListener("click", tapRyoshu);
  </script>
</body>
</html>
